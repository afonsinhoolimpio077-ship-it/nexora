<script>
/* === Integrações futuras (Supabase Auth, M-Pesa, e-Mola, cartão) === */
const SUPABASE_URL="",SUPABASE_KEY=""; // preencher; trocar authSignUp/authVerify por supabase.auth.signUp / verifyOtp
const CT=[["MZ","🇲🇿","Moçambique","MZN"],["ZA","🇿🇦","África do Sul","ZAR"],["AO","🇦🇴","Angola","AOA"],["US","🇺🇸","Estados Unidos","USD"],["BR","🇧🇷","Brasil","BRL"],["GB","🇬🇧","Reino Unido","GBP"],["IN","🇮🇳","Índia","INR"],["ES","🇪🇸","Espanha","EUR"],["FR","🇫🇷","França","EUR"],["MX","🇲🇽","México","MXN"],["AU","🇦🇺","Austrália","AUD"],["CA","🇨🇦","Canadá","CAD"],["DE","🇩🇪","Alemanha","EUR"],["PT","🇵🇹","Portugal","EUR"]];
const RATE={MZN:64,BRL:5.5,USD:1,EUR:.92,ZAR:18,AOA:900,GBP:.79,INR:84,MXN:18,AUD:1.5,CAD:1.38};
const CUR=Object.keys(RATE),$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,c)=>{try{return new Intl.NumberFormat("pt",{style:"currency",currency:c,maximumFractionDigits:2}).format(v)}catch(e){return v.toFixed(2)+" "+c}};
const slugify=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const ALL=CT.slice(0,13).map(c=>c[0]);
function seed(){const P=[{id:"p1",kind:"ebook",title:"Guia de Receitas Fit",desc:"42 receitas saudáveis para a semana.",usd:5,countries:ALL,cover:"",aff:{on:true,pct:30},pages:42},{id:"p2",kind:"course",title:"Marketing Digital do Zero",desc:"Do primeiro anúncio à primeira venda.",usd:29,countries:ALL,cover:"",aff:{on:false,pct:20},modules:"Módulo 1: Fundamentos\nMódulo 2: Tráfego pago\nMódulo 3: Vendas"},{id:"p3",kind:"saas",title:"Painel CRM Lite",desc:"CRM simples para pequenos negócios.",usd:12,countries:ALL,cover:"",aff:{on:false,pct:20},link:"https://exemplo.com/app",billing:"monthly"}];P.forEach(p=>p.slug=slugify(p.title));
const S=[["p1","MZN",0,"Ana"],["p1","BRL",0,"Lucas"],["p2","USD",1,"John"],["p1","MZN",1,"Carlos"],["p3","EUR",2,"Marie"],["p2","BRL",3,"Rita"],["p1","USD",3,"Sam"],["p1","MZN",4,"Ines"],["p3","BRL",5,"Paulo"],["p2","MZN",6,"Zito"]].map((s,i)=>{const p=P.find(x=>x.id==s[0]);return{id:i,pid:s[0],cur:s[1],amt:+(p.usd*RATE[s[1]]).toFixed(2),day:s[2],name:s[3]}});
return{user:null,pending:null,products:P,sales:S,wd:[],buys:[]}}
let D;try{D=JSON.parse(localStorage.getItem("nexora"))}catch(e){}
D=D||seed();let fcur="MZN";
const save=()=>{try{localStorage.setItem("nexora",JSON.stringify(D))}catch(e){toast("Memória cheia: capa não guardada")}};
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3500)}
const LOGO='<svg width="30" height="30" viewBox="0 0 32 32"><path d="M16 2 28 9v14L16 30 4 23V9z" fill="none" stroke="#10d98c" stroke-width="2.4"/><path d="M11 21V11l10 10V11" fill="none" stroke="#10d98c" stroke-width="2.6" stroke-linejoin="round"/></svg>';
const bal=c=>D.sales.filter(s=>s.cur==c).reduce((a,s)=>a+s.amt,0)-D.wd.filter(w=>w.cur==c&&w.status!='recusado').reduce((a,w)=>a+w.amt,0)+(isAdm()?(D.fees||[]).filter(f=>f.cur==c).reduce((a,f)=>a+f.amt,0):0);
const usdEq=(v,c)=>v/RATE[c];

const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('nexora-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbPut=async(k,v)=>{const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})};
const idbGet=async k=>{const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('f').objectStore('f').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};

return`<div class='au'><div class='in'><div class='logo' style='justify-content:center;margin-bottom:22px;color:#fff'>${LOGO}Nexora</div>${f}</div><section class='fx'><h1>Crie, venda e escale seus produtos digitais, físicos e serviços</h1><div class='ftag'>Lançamento</div><p>Launchpad: transforme um prompt num negócio pronto para vender.</p><p>Crie cursos, e-books, mentorias, produtos físicos e muito mais</p><div class='fl'></div><p>Venda mais com ferramentas que aumentam sua conversão</p></section><section class='fx ab'><p>A NEXORA é uma plataforma de comércio digital criada em Moçambique, com visão e alcance nacional. O seu objetivo é permitir que pessoas de diferentes partes do mundo possam criar contas, cadastrar e vender produtos digitais, produtos físicos e serviços, alcançando clientes a nível mundial.</p><p>A plataforma oferece ferramentas para gerir produtos, vendas, receitas e programas de afiliados. Os levantamentos são realizados através de métodos como e-Mola e M-Pesa, entre outros disponíveis.</p><p>A Nexora pretende conectar empreendedores, vendedores e compradores de diferentes países, oferecendo um espaço moderno para desenvolver negócios e expandir as vendas a nível nacional.</p></section><section class='fx fd'><img src='${FOUNDER}' alt='Afonso Sitoe, fundador da Nexora'><h2>AFONSO SITOE</h2><div class='fdt'>Fundador da NEXORA</div><p>Sou Afonso Sitoe, fundador da NEXORA, uma plataforma de comércio digital criada em Moçambique com uma visão nacional.</p><p>Acredito que o futuro dos negócios não tem fronteiras. Foi com essa visão que nasceu a NEXORA: com a ambição de conectar empreendedores, vendedores e compradores de diferentes partes do mundo, criando oportunidades para vender, crescer e alcançar novos mercados.</p><p>O meu objetivo é construir uma plataforma que leve a inovação moçambicana além das fronteiras, colocando Moçambique no mapa do comércio digital nacional.</p><p>A NEXORA é mais do que um projeto. É uma visão de futuro.</p></section><p style='text-align:center;color:#6B7280;font-size:11px;margin:24px 0 0'>Nexora · versão 15/11/2026 · moedas em tempo real</p><div class='bar'>${LOGO}<span>O maior lançamento da história da Nexora</span><button data-a='up' aria-label='Voltar ao topo'>${IC('up')}</button></div></div>`};
Object.assign(A,{reg:()=>{const u={name:$('#n').value.trim(),email:$('#e').value.trim(),phone:'',country:(CT.find(c=>c[0]==detect())||CT[3])[2],pw:$('#p').value};if(!u.name||!u.email.includes('@')||u.pw.length<6)return toast('Preencha nome, e-mail válido e senha (6+ caracteres).');authSignUp(u);route()},
eye:(d,t)=>{const i=$('#p'),s=i.type=='password';i.type=s?'text':'password';t.innerHTML=IC(s?'eyeoff':'eye')},up:()=>window.scrollTo({top:0,behavior:'smooth'}),
legal:d=>{$('#modal').innerHTML=`<div class='modal'><div><h2>${d.k}</h2><p class='mut'>Texto de exemplo: substitua pelos ${d.k.toLowerCase()} oficiais da Nexora antes de publicar.</p><button class='btn w' data-a='wx'>Fechar</button></div></div>`},
social:d=>{const g=d.p=='google',n=g?'Google':'Apple';$('#modal').innerHTML=`<div class='modal'><div><h2>Continuar com ${n}</h2><p class='mut' style='margin-top:-6px;font-size:13px'>Demonstração: informe os dados da conta. A ligação real usa o login OAuth do Supabase (${n}).</p><label>Nome</label><input id='sn'><label>E-mail</label><input id='se' type='email'><button class='btn w' data-a='socialgo' data-p='${d.p}'>Continuar</button><button class='btn g w' style='margin-top:8px' data-a='wx'>Cancelar</button></div></div>`},
socialgo:d=>{const n=$('#sn').value.trim(),e=$('#se').value.trim();if(!n||!e.includes('@'))return toast('Informe nome e e-mail válidos.');const co=(CT.find(c=>c[0]==detect())||CT[3])[2],u={name:n,email:e,phone:'',country:co,provider:d.p};if(!D.users.some(x=>(x.email||'').toLowerCase()==e.toLowerCase()))D.users.push({name:n,email:e,phone:'',country:co,ts:Date.now(),provider:d.p});D.account=D.user=u;D.pending=null;act=Date.now();setAct(act);sessMsg='';save();$('#modal').innerHTML='';location.hash='produtos';route()}});

KB.push([['fundador','fundadora','dono','dona ','proprietario','quem criou','quem fundou','quem fez a nexora','criador da nexora','afonso','sitoe',' ceo '],['O dono e fundador da Nexora é o Afonso Sitoe, um jovem moçambicano que criou a plataforma em Moçambique com uma visão nacional.','A Nexora foi fundada por Afonso Sitoe, jovem empreendedor moçambicano. A sua ambição é conectar empreendedores, vendedores e compradores do mundo inteiro e colocar Moçambique no mapa do comércio digital nacional.']]);
/* IA: objetivo e razão de ser da Nexora */
KB.push([['objetivo','proposito','missao','para que serve','o que e a nexora','o que e nexora','sobre a nexora','o que faz','o que a nexora faz','serve para'],['A Nexora é uma plataforma de comércio digital criada em Moçambique, com visão e alcance nacional. O objetivo é permitir que pessoas de diferentes partes do mundo criem contas, cadastrem e vendam produtos digitais, produtos físicos e serviços, alcançando clientes a nível mundial.','Na Nexora você gere produtos, vendas, receitas e programas de afiliados num só lugar. Os levantamentos são feitos por e-Mola, M-Pesa e outros métodos disponíveis.']]);
KB.push([['porque foi criada','por que foi criada','porque foi criado','por que foi criado','porque criaram','por que criaram','porque a nexora','por que a nexora','porque nasceu','como nasceu','como foi criada','como foi criado','como surgiu','historia','razao','visao','porque existe'],['A Nexora nasceu da visão de que o futuro dos negócios não tem fronteiras. O fundador, Afonso Sitoe, quis conectar empreendedores, vendedores e compradores de diferentes partes do mundo e criar oportunidades para vender, crescer e alcançar novos mercados.','Foi criada para levar a inovação moçambicana além das fronteiras e colocar Moçambique no mapa do comércio digital nacional. Para o fundador, a Nexora é mais do que um projeto: é uma visão de futuro.']]);
/* === Progresso de vendas em tempo real por moeda === */
const COINS=['MZN','USD','BRL','ZAR','EUR','AOA','GBP','INR','MXN','AUD','CAD'],LV=[100,500,1000,5000,10000,50000,100000,500000];let coinCur='MZN';
const sold=c=>Math.max(0,D.sales.filter(s=>s.cur==c).reduce((a,s)=>a+s.amt,0));
function lvl(c){const u=sold(c)/RATE[c];let i=LV.findIndex(m=>u<m);const done=i<0;if(done)i=LV.length-1;const pv=i?LV[i-1]:0,mt=LV[i];return{n:i+1,pct:done?100:Math.max(0,Math.min(100,(u-pv)/(mt-pv)*100)),meta:mt*RATE[c]}}
function coinRender(force){const el=$('#coin');if(!el)return;const rows=COINS.map(c=>({c,v:sold(c),...lvl(c)})),sig=JSON.stringify([rows,coinCur]);if(!force&&el.dataset.sig===sig)return;el.dataset.sig=sig;const pw=el._w||{};
el.innerHTML=`<div class='ct'>SELECCIONAR MOEDA</div>${rows.map(r=>`<div class='cw ${r.c==coinCur?'sel':''}' data-a='coinsel' data-c='${r.c}'><div style='display:flex;justify-content:space-between;gap:8px'><b>${(WC.find(x=>x[0]==r.c)||[0,''])[1]} ${r.c}</b><span>${fmt(r.v,r.c)}</span></div><div class='cb'><i data-w='${r.pct.toFixed(1)}' style='width:${pw[r.c]||0}%'></i></div><div class='mut' style='font-size:12px'>Nível ${r.n} · ${r.pct.toFixed(0)}% · meta ${fmt(r.meta,r.c)}</div></div>`).join('')}`;
el._w=Object.fromEntries(rows.map(r=>[r.c,r.pct.toFixed(1)]));const g=()=>el.querySelectorAll('.cb i').forEach(i=>i.style.width=i.dataset.w+'%');typeof requestAnimationFrame=='function'?requestAnimationFrame(g):g()}
